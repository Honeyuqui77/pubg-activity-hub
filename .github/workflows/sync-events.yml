name: Sync PUBG Events

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）同步一次
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official events API
        shell: bash
        run: |
          python3 << 'PY'
          import json, urllib.request
          from datetime import datetime, timedelta, timezone

          headers = {
              "Origin": "https://pubg.com",
              "Referer": "https://pubg.com/",
              "Service-Game": "pubg",
              "Service-Lang": "zh-cn",
              "Service-Namespace": "PUBG_OFFICIAL",
              "Service-Url": "https://pubg.com/zh-cn/events/notice",
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json",
          }
          url = "https://api-foc.krafton.com/content/post/events?lang=zh-cn&displayLocationType=NORMAL&size=30&page=1"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as res:
              data = json.load(res)

          posts = data.get("_embedded", {}).get("post", [])
          cutoff = datetime.now(timezone.utc) - timedelta(days=45)
          items = []

          # 精选：网页活动（领 G-COIN），官方新闻流里通常没有
          united_end = datetime(2026, 12, 18, 15, 0, 0)
          if datetime.now() <= united_end + timedelta(days=3):
              items.append({
                  "title": "PUBG UNITED 2026：签到 & 胜者预测赢 G-COIN",
                  "summary": "每日签到领抽奖券，预测 PGC/PMGC 前三强，最高可赢 50,000 G-COIN",
                  "postId": "pubgunited2026",
                  "category": "event",
                  "labels": [],
                  "createdAt": "2026-11-17 07:00:00",
                  "displayTime": "2026-11-17 07:00:00",
                  "imageUrl": "https://wstatic-prod.pubg.com/web/live/static/favicons/apple-icon-180x180.png",
                  "thumbUrl": "",
                  "newsUrl": "https://www.pubg.com/zh-cn/events/pubgunited2026",
                  "kind": "event",
                  "source": "featured",
                  "expireAt": "2026-12-18 15:00:00",
              })

          for p in posts:
              raw = p.get("displayStartTime") or p.get("createdAt") or ""
              try:
                  dt = datetime.strptime(raw[:19], "%Y-%m-%d %H:%M:%S").replace(tzinfo=timezone.utc)
              except Exception:
                  dt = datetime.now(timezone.utc)
              if dt < cutoff:
                  continue
              images = p.get("images") or []
              image_url = images[0].get("imageUrl", "") if images else ""
              thumb_url = images[0].get("thumbUrl", "") if images else ""
              items.append({
                  "title": p.get("title", ""),
                  "summary": p.get("summary", ""),
                  "postId": p.get("postId"),
                  "category": p.get("category", "event"),
                  "labels": p.get("labels") or [],
                  "createdAt": p.get("createdAt", ""),
                  "displayTime": raw,
                  "imageUrl": image_url,
                  "thumbUrl": thumb_url,
                  "newsUrl": f"https://pubg.com/zh-cn/events/notice/{p.get('postId')}",
                  "kind": "event",
                  "source": "events",
              })

          with open("events.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          print(f"wrote {len(items)} events")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync official PUBG events"
            git push
          fi
